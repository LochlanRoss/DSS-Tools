# Build a Windows installer from a PyInstaller onedir app and publish GitHub Release assets.
#
# Trigger A — recommended: push an annotated version tag (MAJOR.MINOR.PATCH, optional leading v):
#   git tag -a 0.2.0 -m "Release 0.2.0"
#   git push origin 0.2.0
#   (v0.2.0 still matches if you prefer a v-prefix.)
#
# Trigger B — rebuild an existing tag (after fixing the workflow, etc.):
#   Actions → "Release Windows build" → Run workflow → enter the same tag (e.g. 0.2.0 or v0.2.0).
#
# Requires: Settings → Actions → General → Workflow permissions → "Read and write permissions"
# (so the GITHUB_TOKEN can upload release assets).

name: Release Windows build

on:
  push:
    tags:
      # Semantic version tags only (no arbitrary "v*" names like vbeta).
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Existing Git tag to checkout and attach (e.g. 0.2.0 or v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Resolve tag name
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.version_tag }}
        run: |
          set -e
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          if [ -z "$TAG" ]; then
            echo "No tag resolved"; exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.version_tag) || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller>=6.6" "openpyxl>=3.1,<4" "pywin32>=306" "PySide6>=6.8,<7" "pillow>=10,<12"

      - name: Write bundled version for frozen executable
        shell: bash
        run: |
          printf '%s' '${{ steps.meta.outputs.version }}' > dss_app_version.txt
          cat dss_app_version.txt

      - name: Require branding PNG at repo root
        shell: bash
        run: |
          found=""
          for f in "DSS-Tools Icon.png" "DSS Tools Icon.png" "DSS-Tools-Icon.png" "app-icon.png" "DSSTools Icon.png" "dss_tools.png"; do
            if [ -f "$f" ]; then found="$f"; break; fi
          done
          if [ -z "$found" ]; then
            echo "Release builds require one branding PNG at repo root (first match wins for dss_tools.ico):"
            echo "  DSS-Tools Icon.png | DSS Tools Icon.png | DSS-Tools-Icon.png | app-icon.png | DSSTools Icon.png | dss_tools.png"
            exit 1
          fi
          echo "Using branding PNG: $found"

      - name: Ensure dss_tools.ico (from priority branding PNG)
        run: python tools/ensure_dss_tools_ico.py --force --strict

      - name: Assert dss_tools.ico present for PyInstaller
        shell: bash
        run: test -f dss_tools.ico || exit 1

      - name: Run fast unit tests
        run: python -m unittest test_dss_tools test_dss_tools_updater -q

      - name: PyInstaller (updater onefile, main app onedir)
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $ico = Join-Path $root "dss_tools.ico"
          $upArgs = @(
            "--noconsole", "--onefile", "--name", "DSSToolsUpdater",
            "--uac-admin", "--collect-all", "tkinter",
            "--icon", "dss_tools.ico", "--add-data", "dss_tools.ico;."
          )
          pyinstaller @upArgs (Join-Path $root "dss_tools_updater.py")
          $upExe = Join-Path $root "dist\DSSToolsUpdater.exe"
          if (-not (Test-Path -LiteralPath $upExe)) { throw "DSSToolsUpdater.exe was not produced." }
          $args = @(
            "--noconsole", "--onedir", "--name", "DSSTools",
            "--collect-all", "pywin32",
            "--collect-all", "PySide6",
            "--hidden-import", "dss_tools_updater",
            "--add-data", "dss_app_version.txt;."
          )
          if (-not (Test-Path -LiteralPath $ico)) {
            throw "dss_tools.ico missing; ensure step must run before PyInstaller."
          }
          $args += @("--icon", "dss_tools.ico", "--add-data", "dss_tools.ico;.")
          pyinstaller @args (Join-Path $root "dss_hours_tracker.py")
          $mainExe = Join-Path $root "dist\DSSTools\DSSTools.exe"
          if (-not (Test-Path -LiteralPath $mainExe)) { throw "DSSTools.exe was not produced under dist\\DSSTools." }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer (Inno Setup wizard)
        shell: pwsh
        env:
          MY_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            $iscc = Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe not found after Inno Setup install." }
          $iss = Join-Path $env:GITHUB_WORKSPACE "installer\DSSTools.iss"
          & $iscc /DMyAppVersion=$env:MY_VERSION $iss
          Get-Item (Join-Path $env:GITHUB_WORKSPACE "dist\DSSToolsSetup.exe") | Format-List *

      - name: Write checksums.txt for in-app verification
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          setup_exe = Path("dist") / "DSSToolsSetup.exe"
          if not setup_exe.is_file():
              raise SystemExit(f"Missing installer: {setup_exe}")
          digest = hashlib.sha256(setup_exe.read_bytes()).hexdigest()
          Path("checksums.txt").write_text(
              f"{digest}  *{setup_exe.name}\n",
              encoding="ascii",
              newline="\n",
          )
          print(Path("checksums.txt").read_text())

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/DSSToolsSetup.exe
            checksums.txt
