[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dss-tools"
version = "0.1.0"
description = "DSS Tools — desktop DSS labour-hour summaries and workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "pywin32>=306; platform_system == 'Windows'",
]

[project.gui-scripts]
dss-tools = "dss_hours_tracker:main"

[tool.setuptools]
py-modules = ["dss_hours_tracker"]
